name: Update TD board

on:
  schedule:
    # GitHub cron runs on UTC. Times below are Eastern Standard Time
    # (Nov-Mar); during daylight time (Sep-early Nov) each runs an hour later
    # in Eastern. GitHub can also start scheduled runs 10-60 min late.
    - cron: "0 20 * * 2"   # Tuesday 3:00 PM ET  (after Monday night's game is in the data)
    - cron: "0 3 * * 6"    # Friday 10:00 PM ET  (Saturday 03:00 UTC; picks up final injury designations)
  workflow_dispatch:       # "Run workflow" button on the Actions tab
    inputs:
      pull_odds:
        description: "Pull fresh anytime-TD lines (uses ~1 Odds API credit per game)"
        type: boolean
        default: true

permissions:
  contents: write    # commit the week's CSV + odds file back to the repo
  pages: write       # publish the site
  id-token: write

concurrency:
  group: td-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TD_RAW_DIR: data/raw
      TD_ODDS_DIR: data/odds
      TD_OUT_DIR: docs/weeks
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # prebuilt Linux binaries: installs in ~1-2 min instead of compiling

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::purrr
            any::arrow
            any::nflreadr
            any::httr
            any::jsonlite

      - name: Download nflverse data
        run: Rscript R/fetch_data.R

      - name: Pull anytime-TD lines
        if: github.event_name == 'schedule' || inputs.pull_odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: Rscript R/fetch_odds.R

      - name: Run TD scorer model
        run: Rscript R/td_scorer_model.R

      - name: Build page
        run: Rscript R/build_site.R

      - name: Save this week's results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/odds
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update TD board ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
